# Builds the station card image for a published release and attaches it
# (plus image-info.json) to that release. The image is then SIGNED offline on
# the release machine with `tools/make-release.py --sign-image vX.Y.Z`, and
# only a signed image is offered by Alpium to Raspberry Pi Imager.
name: Station image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the image for (vX.Y.Z)
        required: true
      variant:
        description: all, normal or readonly. A rebuilt image has a new checksum, so sign it again; use readonly to add that image to a release without touching its signed normal image.
        required: false
        default: all

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      # The build script from main (so a fix reaches a published release),
      # the code that goes into the image from the release tag.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: build
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          path: src
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q jq xz-utils parted e2fsprogs
      - name: Build
        if: ${{ github.event_name == 'release' || inputs.variant != 'readonly' }}
        run: sudo SRC="$PWD/src" build/tools/build-image.sh dist
      - name: Build read-only
        if: ${{ github.event_name == 'release' || inputs.variant != 'normal' }}
        run: sudo READ_ONLY=1 SRC="$PWD/src" build/tools/build-image.sh dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/*.img.xz dist/image-info*.json --clobber --repo "${{ github.repository }}"
